<!--
  Supabase → Authentication → Emails → Templates, used for BOTH "Magic link or
  OTP" (returning users) and "Confirm sign up" (first sign-in creates the
  account). Pasted there as one line; live since 2026-09-28.
  Subject: Your IOI sign-in link
  Keep {{ .ConfirmationURL }}: app/auth/confirm/route.ts handles the link it produces.
  Email clients ignore <style> blocks and web fonts, so everything is inline with system fonts.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F1E3;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:20px;padding:36px 32px;">
        <tr>
          <td style="font-size:22px;font-weight:800;letter-spacing:-0.5px;color:#1C1812;">
            I<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#FFC21A;border:3px solid #1C1812;vertical-align:-1px;margin:0 1px;"></span>I
          </td>
        </tr>
        <tr>
          <td style="padding-top:28px;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-0.5px;color:#1C1812;">
            Your sign-in link
          </td>
        </tr>
        <tr>
          <td style="padding-top:12px;font-size:16px;line-height:1.55;color:#4D463A;">
            Tap the button to sign in to IOI. Open it in the same browser you asked from. The link works once, and only for a limited time.
          </td>
        </tr>
        <tr>
          <td style="padding-top:28px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1C1812;color:#FFF8E7;font-size:16px;font-weight:600;text-decoration:none;padding:15px 26px;border-radius:13px;">Sign in to IOI</a>
          </td>
        </tr>
        <tr>
          <td style="padding-top:28px;font-size:13px;line-height:1.55;color:#6F6656;">
            Didn&rsquo;t ask for this? Ignore this email and nothing happens.
          </td>
        </tr>
      </table>
      <p style="margin:18px 0 0;font-size:12px;color:#6F6656;">IOI. Information over incentive. tryioi.com</p>
    </td>
  </tr>
</table>
